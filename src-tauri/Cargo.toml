[package]
name = "stash"
version = "0.1.0"
description = "Stash - Workspace Snapshot Manager"
authors = []
edition = "2021"

[lib]
name = "stash_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "stash"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-store = "2"
tauri-plugin-dialog = "2"
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
x-win = "5"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
