name: Release

# Tagging `v*` builds installers for every supported platform and collects them
# into a draft GitHub Release. Nothing is published until you review the draft.
#
# Tauri cannot cross-compile: Windows installers must be produced on Windows and
# Linux packages on Linux, so this is a matrix rather than a single job.
on:
  push:
    tags:
      - "v*"
  # Lets you exercise the whole pipeline without cutting a real release.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
          # Pinned to 22.04 on purpose. Binaries link against the build machine's
          # glibc, so building on 24.04 produces packages that refuse to start on
          # older distributions. 22.04 (glibc 2.35) is the widest practical target.
          - platform: ubuntu-22.04
            args: ""

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libayatana-appindicator3-dev

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      # The same gates as `bun run validate`, minus the vite build that
      # tauri-action runs itself a moment later.
      - name: Lint, type-check and test
        run: |
          bun run lint
          bun run typecheck
          bun run test
          bun run arch-check

      - name: Rust lint and tests
        working-directory: ./src-tauri
        run: |
          cargo clippy --all-targets -- -D warnings
          cargo test

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Stash ${{ github.ref_name }}"
          releaseBody: |
            See the [changelog](https://github.com/CollinFiske/stash/releases) for details.

            ### Downloads
            - **Windows** — `.exe` installer (per-user, no admin required)
            - **Linux** — `.AppImage` (runs anywhere, `chmod +x` it first), or `.deb` / `.rpm`

            > Stash is not code-signed yet, so Windows will show
            > *"Windows protected your PC"*. Click **More info → Run anyway**.
            > The source is public if you would rather build it yourself.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
